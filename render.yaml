# =============================================================================
#  SecureMed — Render Blueprint (Free Tier Adapted)
# =============================================================================

services:
  # ─────────────────────────────────────────────────── Web (ASGI) ──────────────
  - type: web
    name: securemed-production
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /health/live/
    # This command creates the DB tables, cache table, static files, and superuser!
    preDeployCommand: "python manage.py migrate --noinput && python manage.py createcachetable && python manage.py collectstatic --noinput && (python manage.py createsuperuser --noinput || true)"
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: ALLOWED_HOSTS
        value: "securemed-production.onrender.com"
      - key: FRONTEND_URL
        value: "https://securemed-production.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: AUDIT_LOG_HMAC_KEY
        sync: false
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard using your Neon DB URL
      - key: DB_ENGINE
        value: "postgres"
      
      # === Free Tier Overrides ===
      # Disable Redis completely and fallback to local memory to avoid Error 111
      - key: USE_REDIS_CACHE
        value: "False"
      - key: CACHE_BACKEND
        value: "django.core.cache.backends.locmem.LocMemCache"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@securemed.app"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "Admin@123"

      - key: METRICS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_DIST
        value: "/app/frontend/dist"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: AUDIT_LOG_ASYNC
        value: "False"
      - key: USE_S3_STORAGE
        value: "True"
      - key: AWS_S3_REGION_NAME
        value: "eu-central-1"
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
