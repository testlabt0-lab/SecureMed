name: Android CI/CD (DevSecOps)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./android

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint & Security Checks
      run: ./gradlew lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # v3 of upload-artifact was retired on 2025-01-30 and now fails the step
    # outright rather than warning, so this job could not finish regardless of the
    # build result. `path` stays repository-relative: `defaults.run.working-directory`
    # applies to `run` steps only, never to an action's inputs.
    - name: Upload APK Artifact
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba841c  # v4.6.1
      with:
        name: securemed-app-debug
        if-no-files-found: error
        path: android/app/build/outputs/apk/debug/app-debug.apk
