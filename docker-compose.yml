version: '3.8'

# SecureMed — production-leaning Docker Compose.
# Secrets and credentials are NOT in this file. Copy backend/.env.docker.example
# to backend/.env.docker, fill the values, and `docker compose up` will read
# them via `env_file` below. The .env.docker path is in .gitignore.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: securemed
      POSTGRES_USER: postgres
      # The DB password is supplied at runtime via POSTGRES_PASSWORD (see
      # .env.docker). It is intentionally not hardcoded here so a leaked
      # docker-compose.yml never leaks the database credentials.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: /app/entrypoint.sh
    volumes:
      - ./backend/media:/app/media
      - ./backend/backups:/app/backups
    env_file:
      - path: ./backend/.env.docker
        required: true
    environment:
      # Only non-secret runtime knobs that are always-on in the container.
      DJANGO_SETTINGS_MODULE: config.settings
      TRUST_X_FORWARDED_FOR: "True"
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l INFO
    volumes:
      - ./backend/media:/app/media
      - ./backend/backups:/app/backups
    env_file:
      - path: ./backend/.env.docker
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      - db
      - redis
      - backend

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l INFO
    env_file:
      - path: ./backend/.env.docker
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Observability stack (profile "observe"): scrape Django's /metrics and
  # explore the SecureMed dashboard under deploy/grafana/provisioning.
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      # Grafana's own admin password is set via GF_SECURITY_ADMIN_PASSWORD in
      # .env.docker. The default below is only for the local "observe" profile.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env.docker}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
