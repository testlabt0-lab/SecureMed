# SecureMed — production Compose topology (VPS).
#
# One build, one origin: every Django-side service uses the ROOT multi-stage
# Dockerfile, which builds the React SPA and has Django (Daphne, ASGI) serve
# it — no separate frontend container, no CORS/CSRF split, and the refresh
# cookie is first-party.
#
# Secrets are NOT in this file. Copy backend/.env.docker.example to
# backend/.env.docker, fill the values, and Compose reads them via `env_file`.
#
# Services: db, redis, migrate (one-shot), backend (daphne), celery worker +
# beat, coturn (TURN/STUN for video), nginx TLS proxy (profile "tls"),
# prometheus + grafana (profile "observe").

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: securemed
      POSTGRES_USER: postgres
      # The DB password is supplied at runtime via POSTGRES_PASSWORD (see
      # .env.docker). It is intentionally not hardcoded here so a leaked
      # docker-compose.yml never leaks the database credentials.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port: the database is reachable only on the compose network.
    # Reach it interactively via `docker compose exec db psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securemed"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # No host port; internal network only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration job. Runs before the app service starts; the app then
  # waits for it. Never run `migrate` inside the app itself: replicas race.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py migrate --noinput
    env_file:
      - path: ./backend/.env.docker
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    # Same multi-stage image the SPA is baked into; the image CMD runs Daphne
    # (ASGI — WebSockets for chat/notifications/video signalling).
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend/media:/app/backend/media
      - ./backend/backups:/app/backend/backups
      - frontend_dist:/app/frontend/dist
    env_file:
      - path: ./backend/.env.docker
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      TRUST_X_FORWARDED_FOR: "True"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Loopback only: outside traffic must arrive through the TLS proxy.
    ports:
      - "127.0.0.1:8000:8000"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker -l INFO
    volumes:
      - ./backend/media:/app/backend/media
      - ./backend/backups:/app/backend/backups
    env_file:
      - path: ./backend/.env.docker
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config beat -l INFO
    env_file:
      - path: ./backend/.env.docker
        required: true
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # TURN/STUN relay so WebRTC media survives NAT and restrictive firewalls.
  # Credentials are short-lived HMAC tokens minted by the backend
  # (GET /api/v1/telemedicine/rtc-config/) against TURN_STATIC_AUTH_SECRET —
  # the secret itself never leaves the server and this container.
  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: >
      -n
      --realm=securemed
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?Set TURN_STATIC_AUTH_SECRET in .env.docker}
      --listening-port=3478
      --min-port=49160
      --max-port=49260
      --no-cli
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
    restart: unless-stopped

  # Optional TLS termination (profile "tls"): terminates 80/443 and proxies to
  # the backend over the internal network. Certificates live in deploy/certs/
  # (fullchain.pem + privkey.pem) — see deploy/certs/README.md. Without this
  # profile the backend answers on 127.0.0.1:8000 and you terminate TLS
  # elsewhere (e.g. an external load balancer).
  nginx:
    image: nginx:alpine
    profiles: ["tls"]
    volumes:
      - ./deploy/nginx/securemed.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - frontend_dist:/var/www/frontend:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  # Observability stack (profile "observe"): scrape Django's /metrics and
  # explore the SecureMed dashboard under deploy/grafana/provisioning.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observe"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["observe"]
    environment:
      # Grafana's own admin password is set via GF_SECURITY_ADMIN_PASSWORD in
      # .env.docker.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env.docker}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
  frontend_dist:
