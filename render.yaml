services:
  - type: web
    name: securemed-production
    env: docker
    region: frankfurt # Or your preferred region
    plan: starter # Starter plan recommended for PostgreSQL + Django
    healthCheckPath: /health/live/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard using your Neon DB URL
      - key: DB_ENGINE
        value: "postgres"
      - key: FRONTEND_DIST
        value: "/app/frontend/dist"
      - key: SECURE_SSL_REDIRECT
        value: "True"
