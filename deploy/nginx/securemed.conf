# SecureMed — TLS termination proxy.
#
# Sits in front of the backend (which serves both the API and the built SPA
# from one origin). Certificates are expected at /etc/nginx/certs — mounted
# from deploy/certs/ (fullchain.pem + privkey.pem). See deploy/certs/README.md.

# Long-lived connections (WebSocket: chat, notifications, video signalling)
# and 20 MB medical-file uploads both pass through here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # ACME challenges and plain-HTTP health probes only; everything else is
    # redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: the TLS edge adds transport security, which the app itself
    # cannot express.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Medical file uploads are capped at 20 MB by the app; leave headroom.
    client_max_body_size 25m;

    root /var/www/frontend;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|admin|static|media|health|metrics|privacy)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One trusted proxy: TRUSTED_PROXY_COUNT=1 in .env.docker matches this
        # hop exactly.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
