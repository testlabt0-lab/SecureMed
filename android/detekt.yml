# detekt config for the release pipeline (4-2). The defaults carry most of
# the weight; only the rules that genuinely fit this codebase differently are
# written down. Silent in effect, loud in CI: detekt failures block the tag.
#
# Every deactivation below is a recorded decision, not a shrug: wildcards
# match the tree's imports, PascalCase composables are Compose convention,
# and the broad catches are the app's degrade-don't-crash I/O policy.

build:
  maxIssues: 0

complexity:
  LongMethod:
    # Compose screens with dialogs read as long functions by design; the
    # dialogs are one function on purpose (state locality). 320 covers the
    # big screens (Login 275, ChannelDetail 309, MainActivity 222) while
    # still catching genuine monsters.
    threshold: 320
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
  NestedBlockDepth:
    # adherenceStats is a double loop by definition (plans × days × times).
    threshold: 5
  LargeClass:
    # SecureMedRepository is one class on purpose: the single offline facade
    # every ViewModel already talks to. Splitting it is a refactor pass, not
    # a release gate.
    active: false

style:
  MagicNumber:
    # Numbers like IV_BYTES, colors, dp values, status codes are contextual.
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  UnusedParameter:
    active: false
    ignoreAnnotated: ['Suppress']
  MaxLineLength:
    maxLineLength: 160
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  WildcardImport:
    # kotlinx.serialization.*, material3.*, room.* wildcard imports are the
    # established convention across this tree — a rename there degrades one
    # import line, not a build.
    active: false

exceptions:
  TooGenericExceptionCaught:
    # The app's I/O boundary deliberately catches Throwable/Exception: a
    # cache miss or network failure must degrade, never crash. Callers that
    # can surface an error do; the rest degrade by design.
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    # Compose names composables in PascalCase (`PatientDetailScreen`) — the
    # camelCase function rule does not apply to this codebase's UI layer.
    active: false
  MatchingDeclarationName:
    # Routes.kt holds data objects; BottomNavBar.kt a single composable —
    # file names are not a rule worth enforcing over component grouping.
    active: false
  VariableNaming:
    active: false
  MemberNameEqualsClassName:
    active: false

