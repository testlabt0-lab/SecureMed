# =============================================================================
#  SecureMed — Monitoring & Observability Stack
# =============================================================================
#  Usage:
#    docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
#
#  Services:
#    prometheus      : Metrics collection & alerting
#    grafana         : Visualization dashboards
#    node-exporter   : System metrics (CPU, Memory, Disk)
#    redis-exporter  : Redis metrics
#    postgres-exporter: PostgreSQL metrics
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------- Prometheus ---
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: securemed-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - default
    depends_on:
      - backend

  # ------------------------------------------------------------- Grafana ---
  grafana:
    image: grafana/grafana:10.1.0
    container_name: securemed-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-securemed_grafana_admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3001:3030"
    networks:
      - default
    depends_on:
      - prometheus

  # --------------------------------------------------------- Node Exporter ---
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: securemed-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    expose:
      - "9100"
    networks:
      - default

  # -------------------------------------------------------- Redis Exporter ---
  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    container_name: securemed-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    networks:
      - default
    depends_on:
      - redis

  # --------------------------------------------------- Postgres Exporter ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: securemed-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://securemed:securemed-db-pass@postgres:5432/securemed?sslmode=require"
    expose:
      - "9187"
    networks:
      - default
    depends_on:
      - postgres

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    external: true
    name: workspace_default
