name: Deploy to SmarterASP.net

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: 🛠️ Build Frontend (Vite)
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install Python Dependencies & Collect Static
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # إنشاء مجلدات ضرورية
        mkdir -p staticfiles
        # سحب ملفات الواجهة الأمامية ودمجها مع الباك إند
        python manage.py collectstatic --noinput

    - name: 🚀 Deploy to SmarterASP.net via Web Deploy
      uses: glitchedgitz/web-deploy-action@v2.0.4
      with:
        server-computer-name: ${{ secrets.WEB_DEPLOY_SERVER }}
        server-username: ${{ secrets.WEB_DEPLOY_USERNAME }}
        server-password: ${{ secrets.WEB_DEPLOY_PASSWORD }}
        server-website-name: ${{ secrets.WEB_DEPLOY_SITE_NAME }}
        source-path: './backend'
