# =============================================================================
#  SecureMed — Nginx Reverse Proxy Configuration
#  - TLS termination (self-signed or Let's Encrypt)
#  - Security headers (HSTS, CSP, X-Frame, etc.)
#  - Rate limiting per zone
#  - Gzip compression
#  - Static file caching
# =============================================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

upstream securemed_backend {
    server backend:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS main
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript font/woff2;

    client_max_body_size 25M;

    # Health check
    location = /health/ {
        proxy_pass http://securemed_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Auth endpoints (strict rate limiting)
    location ~ ^/api/v1/auth/(login|biometric)/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://securemed_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # API
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass         http://securemed_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 120s;
    }

    # Admin
    location /admin/ {
        limit_req zone=login_limit burst=3;
        proxy_pass         http://securemed_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # AI
    location /ai/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass         http://securemed_backend;
        proxy_set_header   Host              $host;
        proxy_read_timeout 120s;
    }

    # Static files
    location /static/ {
        proxy_pass http://securemed_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA catch-all
    location / {
        proxy_pass         http://securemed_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Block hidden files
    location ~ /\. { deny all; return 404; }
}
