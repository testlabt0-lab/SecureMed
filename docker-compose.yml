# =============================================================================
#  SecureMed — Full Production Stack (Docker Compose v2)
# =============================================================================
#
#  أوضاع التشغيل:
#    1. عرض سريع (SQLite + بدون Redis):
#         docker compose up backend ai
#
#    2. مع PostgreSQL:
#         docker compose --profile db up
#
#    3. مكتمل للإنتاج (+ Redis + Celery + Nginx):
#         docker compose --profile db --profile full up
#
#  متغيرات البيئة: backend/.env (راجع backend/.env.example)
# =============================================================================

services:

  # ─────────────────────────────────────────────────── PostgreSQL ──────────────
  postgres:
    image: postgres:16-alpine
    profiles: ["db", "full"]
    environment:
      POSTGRES_DB: securemed
      POSTGRES_USER: securemed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securemed-db-pass-2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securemed -d securemed"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────── Redis ───────────────────
  redis:
    image: redis:7-alpine
    profiles: ["full"]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-securemed-redis-2026}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-securemed-redis-2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────── AI Service ──────────────
  ai:
    build:
      context: ./ai-service
    environment:
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - PORT=8100
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:8100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────── Backend ─────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      AI_SERVICE_URL: http://ai:8100
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,${DOMAIN:-}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8000}"
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_HOST: "${DB_HOST:-}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-securemed-redis-2026}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-securemed-redis-2026}@redis:6379/0"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 3
               --timeout 120
               --keep-alive 5
               --access-logfile -"
    restart: unless-stopped
    volumes:
      - media:/app/backend/media
      - logs:/app/backend/logs

  # ─────────────────────────────────────────────────── Celery Worker ────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: ["full"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      AI_SERVICE_URL: http://ai:8100
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_HOST: "${DB_HOST:-}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-securemed-redis-2026}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-securemed-redis-2026}@redis:6379/0"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A config worker
        --loglevel=info
        --concurrency=2
        --max-tasks-per-child=100
    restart: unless-stopped
    volumes:
      - media:/app/backend/media
      - logs:/app/backend/logs

  # ─────────────────────────────────────────────────── Celery Beat ──────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: ["full"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      AI_SERVICE_URL: http://ai:8100
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_HOST: "${DB_HOST:-}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-securemed-redis-2026}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-securemed-redis-2026}@redis:6379/0"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A config beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped

  # ─────────────────────────────────────────────────── Nginx ───────────────────
  nginx:
    image: nginx:1.27-alpine
    profiles: ["full"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./devsecops/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/certs/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./backend/certs/server.key:/etc/nginx/ssl/server.key:ro
      - media:/app/backend/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  logs:
