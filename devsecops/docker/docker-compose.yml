version: '3.8'

services:
  # PostgreSQL with TLS
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: securemed
      POSTGRES_USER: securemed
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securemed_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securemed"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ../..
      dockerfile: devsecops/docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: 'False'
      DB_HOST: db
      DB_NAME: securemed
      DB_USER: securemed
      DB_PASSWORD: ${DB_PASSWORD:-securemed_strong_password}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-this-encryption-key}
      ALLOWED_HOSTS: backend,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost,http://frontend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (Nginx)
  frontend:
    build:
      context: ../..
      dockerfile: devsecops/docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
