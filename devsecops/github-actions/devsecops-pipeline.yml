# DevSecOps pipeline for SecureMed — REFERENCE DESIGN, NOT EXECUTED.
#
# GitHub Actions reads workflows from .github/workflows/ only. This file sits in
# devsecops/github-actions/, so none of it has ever run: the daily 02:00 scan below has
# never fired once, and no push or pull request has ever been gated by any of the seven
# stages. The comment that used to be on this line — "runs on every push and PR to
# ensure security at every stage" — was therefore the opposite of true, and it is the
# kind of claim that gets read as evidence during an audit.
#
# It is kept here, and kept out of .github/workflows/, because most of it would either
# fail immediately or pass dishonestly if it were activated as written:
#
#   Stage 1 (sast) — `returntocorp/semgrep-action@v1` is deprecated; the organisation
#     renamed to `semgrep/`. Semgrep now runs as `semgrep scan` in
#     .github/workflows/security-scan.yml. SonarQube needs a SONAR_TOKEN and a server
#     that this project does not have.
#   Stage 2 (backend-test) — cannot start. It sets DJANGO_SETTINGS_MODULE=config.settings
#     with DEBUG: False and passes neither SECRET_KEY nor ENCRYPTION_KEY, and settings.py
#     has no fallback for SECRET_KEY outside DEBUG, so `manage.py migrate` aborts with
#     UndefinedValueError before any test is collected. There is also no redis service,
#     while DEBUG=False selects django_redis with IGNORE_EXCEPTIONS: False. Both bandit
#     invocations end in `|| true`. .github/workflows/tests.yml does this properly.
#   Stage 3 (frontend-test) — eslint and npm audit both end in `|| true`, so neither can
#     fail the build; the eslint step also assumes a config that the frontend does not
#     currently ship.
#   Stage 4 (android-build) — `mobSF/mobsf-action@v1` is not a maintained action and
#     scanning a debug APK says little about the release build.
#     .github/workflows/android.yml covers lint, unit tests and the APK.
#   Stage 5 (container-scan) — the one stage worth keeping, now promoted to
#     .github/workflows/container-scan.yml: without `exit-code: '0'` (which turned every
#     finding into a pass) and without a mutable third-party action ref, for the reason
#     documented in that file under CVE-2026-33634.
#   Stage 6 (dast) — starts the container with no SECRET_KEY or DATABASE_URL, so the
#     process exits at import and the `curl -f http://localhost:8000/health/` guard
#     fails the job before ZAP is reached. ZAP itself carries `fail_action: false`.
#   Stage 7 (deploy) — prints "All security checks passed!" and cuts a GitHub Release on
#     every push to main. Every gate it depends on is `|| true`, `fail_action: false` or
#     `exit-code: '0'`, so the message is unconditional, and the Release attaches a
#     *debug* APK — unsigned, debuggable, and not what should ever be published.
#
# Reviving any stage means moving it into .github/workflows/ and fixing the above first.

name: 🔒 DevSecOps Pipeline (reference design — not run by GitHub)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily security scan at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ==================================================
  # Stage 1: SAST (Static Application Security Testing)
  # ==================================================
  sast:
    name: 🔍 SAST - Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Semgrep - SAST scanner
      - name: 🔬 Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/django
            p/javascript
            p/react
            p/owasp-top-ten
            p/security-audit
          generateSarif: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # SonarQube Scan (if SONAR_TOKEN is set)
      - name: 📊 SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================================================
  # Stage 2: Backend Tests & Security
  # ==================================================
  backend-test:
    name: 🐍 Backend Tests & Security
    runs-on: ubuntu-latest
    needs: sast

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: securemed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit safety pytest pytest-django pytest-cov

      # Bandit - Python security scanner
      - name: 🔒 Bandit Security Scan
        run: |
          bandit -r backend/ -c backend/.bandit.yml -f json -o bandit-report.json
          bandit -r backend/ -c backend/.bandit.yml || true

      # Safety - dependency vulnerability check
      - name: 🛡️ Safety - Dependency Check
        run: |
          safety check --file backend/requirements.txt --output json --output safety-report.json || true
          safety check --file backend/requirements.txt || true

      # Run tests with coverage
      - name: ✅ Run Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DEBUG: False
          DB_HOST: localhost
          DB_NAME: securemed_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          cd backend
          python manage.py migrate
          pytest --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ==================================================
  # Stage 3: Frontend Tests & Security
  # ==================================================
  frontend-test:
    name: ⚛️ Frontend Tests & Security
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      # ESLint with security plugin
      - name: 🔒 ESLint Security Scan
        run: |
          cd frontend
          npx eslint src --ext .ts,.tsx --format json > eslint-report.json || true

      # npm audit
      - name: 🛡️ NPM Audit
        run: |
          cd frontend
          npm audit --audit-level=moderate --json > npm-audit.json || true

      # Build
      - name: 📦 Build
        run: |
          cd frontend
          npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build
          path: frontend/dist/

  # ==================================================
  # Stage 4: Android Build & Security
  # ==================================================
  android-build:
    name: 📱 Android Build & Security
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # MobSF - Mobile Security Framework scan
      - name: 📱 MobSF Security Scan
        uses: mobSF/mobsf-action@v1
        with:
          apk_path: android/app/build/outputs/apk/debug/app-debug.apk
          output_format: json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: securemed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ==================================================
  # Stage 5: Container Security (Trivy)
  # ==================================================
  container-scan:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t securemed-backend:latest -f devsecops/docker/Dockerfile.backend .

      # Trivy - Container & filesystem scanner
      - name: 🔬 Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securemed-backend:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ==================================================
  # Stage 6: DAST (Dynamic Application Security Testing)
  # ==================================================
  dast:
    name: 🔥 DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Start Backend
        run: |
          docker build -t securemed-backend:latest -f devsecops/docker/Dockerfile.backend .
          docker run -d -p 8000:8000 --name securemed-api securemed-backend:latest
          sleep 10
          curl -f http://localhost:8000/health/ || exit 1

      # OWASP ZAP Baseline Scan
      - name: 🔥 ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000/api/v1/'
          cmd_options: '-a -j'
          issue_title: 'OWASP ZAP Security Issues'
          fail_action: false

  # ==================================================
  # Stage 7: Deploy (only on main)
  # ==================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, android-build, container-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy notification
        run: |
          echo "✅ All security checks passed!"
          echo "🚀 Deploying SecureMed to production..."
          echo "Build triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
