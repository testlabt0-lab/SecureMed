# DevSecOps Pipeline for SecureMed
# This workflow runs on every push and PR to ensure security at every stage

name: 🔒 DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily security scan at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ==================================================
  # Stage 1: SAST (Static Application Security Testing)
  # ==================================================
  sast:
    name: 🔍 SAST - Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Semgrep - SAST scanner
      - name: 🔬 Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/django
            p/javascript
            p/react
            p/owasp-top-ten
            p/security-audit
          generateSarif: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # SonarQube Scan (if SONAR_TOKEN is set)
      - name: 📊 SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================================================
  # Stage 2: Backend Tests & Security
  # ==================================================
  backend-test:
    name: 🐍 Backend Tests & Security
    runs-on: ubuntu-latest
    needs: sast

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: securemed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit safety pytest pytest-django pytest-cov

      # Bandit - Python security scanner
      - name: 🔒 Bandit Security Scan
        run: |
          bandit -r backend/ -c backend/.bandit.yml -f json -o bandit-report.json
          bandit -r backend/ -c backend/.bandit.yml || true

      # Safety - dependency vulnerability check
      - name: 🛡️ Safety - Dependency Check
        run: |
          safety check --file backend/requirements.txt --output json --output safety-report.json || true
          safety check --file backend/requirements.txt || true

      # Run tests with coverage
      - name: ✅ Run Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DEBUG: False
          DB_HOST: localhost
          DB_NAME: securemed_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          cd backend
          python manage.py migrate
          pytest --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ==================================================
  # Stage 3: Frontend Tests & Security
  # ==================================================
  frontend-test:
    name: ⚛️ Frontend Tests & Security
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      # ESLint with security plugin
      - name: 🔒 ESLint Security Scan
        run: |
          cd frontend
          npx eslint src --ext .ts,.tsx --format json > eslint-report.json || true

      # npm audit
      - name: 🛡️ NPM Audit
        run: |
          cd frontend
          npm audit --audit-level=moderate --json > npm-audit.json || true

      # Build
      - name: 📦 Build
        run: |
          cd frontend
          npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build
          path: frontend/dist/

  # ==================================================
  # Stage 4: Android Build & Security
  # ==================================================
  android-build:
    name: 📱 Android Build & Security
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # MobSF - Mobile Security Framework scan
      - name: 📱 MobSF Security Scan
        uses: mobSF/mobsf-action@v1
        with:
          apk_path: android/app/build/outputs/apk/debug/app-debug.apk
          output_format: json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: securemed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ==================================================
  # Stage 5: Container Security (Trivy)
  # ==================================================
  container-scan:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t securemed-backend:latest -f devsecops/docker/Dockerfile.backend .

      # Trivy - Container & filesystem scanner
      - name: 🔬 Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securemed-backend:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ==================================================
  # Stage 6: DAST (Dynamic Application Security Testing)
  # ==================================================
  dast:
    name: 🔥 DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Start Backend
        run: |
          docker build -t securemed-backend:latest -f devsecops/docker/Dockerfile.backend .
          docker run -d -p 8000:8000 --name securemed-api securemed-backend:latest
          sleep 10
          curl -f http://localhost:8000/health/ || exit 1

      # OWASP ZAP Baseline Scan
      - name: 🔥 ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000/api/v1/'
          cmd_options: '-a -j'
          issue_title: 'OWASP ZAP Security Issues'
          fail_action: false

  # ==================================================
  # Stage 7: Deploy (only on main)
  # ==================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, android-build, container-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy notification
        run: |
          echo "✅ All security checks passed!"
          echo "🚀 Deploying SecureMed to production..."
          echo "Build triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
