# =============================================================================
# SecureMed — SonarQube Project Configuration
# =============================================================================

sonar.projectKey=securemed
sonar.projectName=SecureMed Healthcare Platform
sonar.projectVersion=1.0.0

# Source directories to analyze (Backend Python, Frontend React, Android Kotlin)
sonar.sources=backend,frontend/src,android/app/src/main/java

# Exclude generated code, dependencies, build outputs, and migrations
sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.gradle/**,\
  **/.venv/**,\
  **/venv/**,\
  **/media/**,\
  **/staticfiles/**,\
  **/backups/**,\
  **/*.min.js,\
  **/*.min.css,\
  frontend/dist/**

# Test files locations
sonar.tests=backend/tests,frontend/src/**/*.test.tsx,android/app/src/test/java

# Language specific settings
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# JavaScript / TypeScript / React
sonar.javascript.environments=browser,node
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Quality Gate enforcement
sonar.qualitygate.wait=false
