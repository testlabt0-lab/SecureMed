# ============================================================
# SecureMed — Render Blueprint (نشر بنقرة واحدة)
# ============================================================
# Deploy both services with one import:
#   Render Dashboard → New + → Blueprint → pick this repo
#
# Architecture:
#   securemed-web : Django (API + built React SPA via whitenoise)
#   securemed-ai  : Node AI microservice (GLM assistant) — private,
#                   called server-to-server by Django only.
#
# Database: create a free PostgreSQL at https://neon.tech and paste its
# connection string into the DATABASE_URL env var after the first deploy
# (or before — Blueprint deploys with sync:false prompts).
# ============================================================

services:
  # ---------------- Django web + SPA ----------------
  - type: web
    name: securemed-web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash ../deploy/build.sh
    startCommand: bash ../deploy/start.sh
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # Accept any *.onrender.com subdomain (adjust after adding a custom domain)
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      # Free-forever PostgreSQL: https://neon.tech → copy the pooled URL
      - key: DATABASE_URL
        sync: false
      # SQLite fallback for demo-only deploys (ignored when DATABASE_URL is set)
      - key: DB_ENGINE
        value: "sqlite"
      - key: SEED_DEMO_DATA
        value: "1"
      # AI microservice (set its hostname after both services exist,
      # or leave the default and Render resolves it via fromService below)
      - key: AI_SERVICE_HOST
        fromService:
          type: web
          name: securemed-ai
          property: host
      # Optional: real SMTP for email notifications (Gmail app password etc.)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # ---------------- AI microservice ----------------
  - type: web
    name: securemed-ai
    runtime: node
    plan: free
    rootDir: ai-service
    buildCommand: npm install
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: ZAI_BASE_URL
        sync: false   # e.g. https://api.z.ai/v1
      - key: ZAI_API_KEY
        sync: false   # your Z.ai API key
